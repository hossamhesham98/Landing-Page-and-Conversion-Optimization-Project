{
  "name": "docloroo-production",
  "services": {
    "postgres": {
      "image": "postgres:15-alpine",
      "environment": {
        "POSTGRES_DB": "medusa",
        "POSTGRES_USER": "medusa",
        "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      },
      "volumes": [
        "postgres-data:/var/lib/postgresql/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U medusa -d medusa"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 15
      },
      "restart": "unless-stopped",
      "init": true,
      "mem_limit": "768m",
      "cpus": 0.75,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "redis": {
      "image": "redis:7-alpine",
      "command": [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
      ],
      "environment": {
        "REDIS_PASSWORD": "${REDIS_PASSWORD}"
      },
      "volumes": [
        "redis-data:/data"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 15
      },
      "restart": "unless-stopped",
      "init": true,
      "mem_limit": "256m",
      "cpus": 0.25,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "medusa": {
      "image": "docloroo-medusa:20261031",
      "environment": {
        "NODE_ENV": "production",
        "HOST": "0.0.0.0",
        "PORT": "9000",
        "MEDUSA_WORKER_MODE": "server",
        "DATABASE_URL": "postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa",
        "REDIS_URL": "redis://:${REDIS_PASSWORD}@redis:6379",
        "JWT_SECRET": "${JWT_SECRET:?Set JWT_SECRET}",
        "COOKIE_SECRET": "${COOKIE_SECRET:?Set COOKIE_SECRET}",
        "STORE_CORS": "https://${STOREFRONT_DOMAIN},https://www.${STOREFRONT_DOMAIN}",
        "ADMIN_CORS": "https://${ADMIN_DOMAIN},https://${MEDUSA_DOMAIN}",
        "AUTH_CORS": "https://${STOREFRONT_DOMAIN},https://www.${STOREFRONT_DOMAIN},https://${ADMIN_DOMAIN},https://${MEDUSA_DOMAIN}",
        "MEDUSA_PUBLIC_URL": "https://${MEDUSA_DOMAIN}",
        "MEDUSA_BACKEND_URL": "https://${MEDUSA_DOMAIN}",
        "DOCLOROO_PUBLIC_URL": "https://${STOREFRONT_DOMAIN}",
        "DOCLOROO_TRACKING_SECRET": "${DOCLOROO_TRACKING_SECRET:?Set tracking secret}",
        "DOCLOROO_CHECKOUT_VERIFIED": "true",
        "DOCLOROO_PRODUCTION_LAUNCH_APPROVED": "true",
        "DOCLOROO_MAIL_ENABLED": "${DOCLOROO_MAIL_ENABLED:-false}",
        "SMTP_PORT": "${SMTP_PORT:-587}",
        "DOCLOROO_DEVELOPMENT_TEST": "false",
        "DOCLOROO_LOCAL_QA": "false",
        "DOCLOROO_INTERNAL_QA": "false",
        "DOCLOROO_MAIL_SINK": "false",
        "SMTP_HOST": "${SMTP_HOST:-}",
        "SMTP_FROM": "${SMTP_FROM:-}",
        "SMTP_USER": "${SMTP_USER:-}",
        "SMTP_PASSWORD": "${SMTP_PASSWORD:-}"
      },
      "ports": [
        "127.0.0.1:9100:9000"
      ],
      "volumes": [
        "medusa-uploads:/app/apps/backend/static"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "15s",
        "timeout": "5s",
        "start_period": "90s",
        "retries": 15
      },
      "restart": "unless-stopped",
      "init": true,
      "mem_limit": "2048m",
      "cpus": 1.0,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "storefront": {
      "image": "docloroo-storefront:20261031",
      "ports": [
        "127.0.0.1:3100:3000"
      ],
      "environment": {
        "NODE_ENV": "production",
        "LOCAL_HTTP": "false",
        "MEDUSA_INTERNAL_URL": "http://medusa:9000",
        "MEDUSA_PUBLISHABLE_KEY": "${MEDUSA_PUBLISHABLE_KEY:-}",
        "DOCLOROO_DEVELOPMENT_TEST": "false",
        "DOCLOROO_PRODUCTION_LAUNCH_APPROVED": "true"
      },
      "depends_on": {
        "medusa": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "20s",
        "timeout": "8s",
        "start_period": "40s",
        "retries": 6
      },
      "restart": "unless-stopped",
      "init": true,
      "mem_limit": "512m",
      "cpus": 0.75,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "admin": {
      "image": "docloroo-admin:20261031",
      "ports": [
        "127.0.0.1:3101:3001"
      ],
      "environment": {
        "NODE_ENV": "production",
        "LOCAL_HTTP": "false",
        "MEDUSA_URL": "http://medusa:9000"
      },
      "depends_on": {
        "medusa": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.status<400?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "20s",
        "timeout": "8s",
        "start_period": "40s",
        "retries": 6
      },
      "restart": "unless-stopped",
      "init": true,
      "mem_limit": "512m",
      "cpus": 0.5,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "worker": {
      "image": "docloroo-medusa:20261031",
      "environment": {
        "NODE_ENV": "production",
        "HOST": "0.0.0.0",
        "PORT": "9000",
        "MEDUSA_WORKER_MODE": "worker",
        "DATABASE_URL": "postgres://medusa:${POSTGRES_PASSWORD}@postgres:5432/medusa",
        "REDIS_URL": "redis://:${REDIS_PASSWORD}@redis:6379",
        "JWT_SECRET": "${JWT_SECRET:?Set JWT_SECRET}",
        "COOKIE_SECRET": "${COOKIE_SECRET:?Set COOKIE_SECRET}",
        "STORE_CORS": "https://${STOREFRONT_DOMAIN},https://www.${STOREFRONT_DOMAIN}",
        "ADMIN_CORS": "https://${ADMIN_DOMAIN},https://${MEDUSA_DOMAIN}",
        "AUTH_CORS": "https://${STOREFRONT_DOMAIN},https://www.${STOREFRONT_DOMAIN},https://${ADMIN_DOMAIN},https://${MEDUSA_DOMAIN}",
        "MEDUSA_PUBLIC_URL": "https://${MEDUSA_DOMAIN}",
        "MEDUSA_BACKEND_URL": "https://${MEDUSA_DOMAIN}",
        "DOCLOROO_PUBLIC_URL": "https://${STOREFRONT_DOMAIN}",
        "DOCLOROO_TRACKING_SECRET": "${DOCLOROO_TRACKING_SECRET:?Set tracking secret}",
        "DOCLOROO_CHECKOUT_VERIFIED": "true",
        "DOCLOROO_PRODUCTION_LAUNCH_APPROVED": "true",
        "DOCLOROO_MAIL_ENABLED": "${DOCLOROO_MAIL_ENABLED:-false}",
        "SMTP_PORT": "${SMTP_PORT:-587}",
        "DOCLOROO_DEVELOPMENT_TEST": "false",
        "DOCLOROO_LOCAL_QA": "false",
        "DOCLOROO_INTERNAL_QA": "false",
        "DOCLOROO_MAIL_SINK": "false",
        "SMTP_HOST": "${SMTP_HOST:-}",
        "SMTP_FROM": "${SMTP_FROM:-}",
        "SMTP_USER": "${SMTP_USER:-}",
        "SMTP_PASSWORD": "${SMTP_PASSWORD:-}",
        "DISABLE_MEDUSA_ADMIN": "true"
      },
      "volumes": [
        "medusa-uploads:/app/apps/backend/static"
      ],
      "depends_on": {
        "postgres": {
          "condition": "service_healthy"
        },
        "redis": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "init": true,
      "mem_limit": "1536m",
      "cpus": 0.75,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  },
  "volumes": {
    "postgres-data": {},
    "redis-data": {},
    "medusa-uploads": {}
  }
}
